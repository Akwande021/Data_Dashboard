<!-- Shared layout: sidebar nav + top bar, other pages extend this and fill the "content" block -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nexus Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="layout">
        <!-- Collapsible sidebar navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="logo">Nexus</span>
                <button id="sidebar-toggle" aria-label="Toggle sidebar">☰</button>
            </div>
            <nav>
                <a href="{{ url_for('pages.index') }}">Overview</a>
                <a href="{{ url_for('pages.tasks_page') }}">Tasks</a>
                <!-- Finance / Projects / Fitness / Study pages will be added as their routes exist -->
            </nav>
        </aside>

        <div class="main">
            <!-- Top bar with dark mode toggle -->
            <header class="topbar">
                <button id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
            </header>

            <main class="content">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
